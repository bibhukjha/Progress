<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Progress">
<link rel="manifest" href="./manifest.webmanifest">
<title>Daily Progress</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f3fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15141d" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#fbfafc;--card:rgba(255,255,255,.66);--ink:#242235;--mute:#77758a;--line:rgba(72,66,98,.14);--a:#c9b8ff;--b:#9fe2d2;--dark:#3f3a58;--onDark:#fff;--shadow:0 12px 38px rgba(55,48,82,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:16px/1.45 Tahoma,Arial,sans-serif}
body{min-height:100vh;background:#fbfafc;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-14%;z-index:-2;pointer-events:none;background:
radial-gradient(42% 38% at 8% 12%,rgba(255,198,222,.70),transparent 72%),
radial-gradient(38% 34% at 91% 10%,rgba(195,222,255,.66),transparent 72%),
radial-gradient(44% 38% at 88% 88%,rgba(207,246,231,.64),transparent 72%),
radial-gradient(34% 30% at 15% 84%,rgba(255,239,184,.48),transparent 72%);
filter:blur(10px);transform:scale(1.04);animation:mood 36s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.36),rgba(255,255,255,.08) 48%,rgba(255,255,255,.26));mix-blend-mode:soft-light}
@keyframes mood{
0%{transform:scale(1.04) rotate(0deg);filter:blur(10px) hue-rotate(0deg)}
16%{transform:scale(1.07) rotate(1deg);filter:blur(11px) hue-rotate(8deg)}
32%{transform:scale(1.05) rotate(-1deg);filter:blur(10px) hue-rotate(-6deg)}
48%{transform:scale(1.08) rotate(1deg);filter:blur(12px) hue-rotate(12deg)}
64%{transform:scale(1.05) rotate(-1deg);filter:blur(10px) hue-rotate(-8deg)}
80%{transform:scale(1.07) rotate(1deg);filter:blur(11px) hue-rotate(7deg)}
100%{transform:scale(1.04) rotate(0deg);filter:blur(10px) hue-rotate(0deg)}
}
.serif,h1,h2{font-family:Tahoma,Arial,sans-serif}
h1,h2{font-weight:700;margin:0}h1{font-size:32px;letter-spacing:-.5px}h2{font-size:22px;margin:24px 0 10px}
.mute{color:var(--mute);font-size:14px}
main{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(120px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(115%);backdrop-filter:blur(18px) saturate(115%);border:1px solid rgba(255,255,255,.55);border-radius:24px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}
.g2{display:grid;gap:14px;margin-top:14px}.g2>.card{margin:0}
.btn{border:0;border-radius:99px;background:var(--dark);color:var(--onDark);font:600 16px Tahoma,Arial,sans-serif;padding:13px 24px;cursor:pointer;box-shadow:0 6px 18px rgba(63,58,88,.14)}
.btn.ghost{background:rgba(255,255,255,.55);color:var(--ink);border:1px solid rgba(72,66,98,.10)}
.hero{background:linear-gradient(135deg,rgba(255,214,231,.76),rgba(207,226,255,.68) 52%,rgba(209,246,232,.70));color:var(--ink);border-radius:30px;padding:22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:16px 0;box-shadow:var(--shadow)}
.chip{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.7);padding:8px 14px;border-radius:99px;font-weight:600;backdrop-filter:blur(12px)}
.wk{display:flex;gap:8px}.wk i{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.45);display:grid;place-items:center;font:600 11px Tahoma,Arial,sans-serif;font-style:normal;opacity:.8}.wk i.on{background:linear-gradient(135deg,var(--a),var(--b));color:#2b2a3a;opacity:1}
.big{font:700 34px Tahoma,Arial,sans-serif}.bar{height:8px;background:rgba(72,66,98,.10);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#cbb9ff,#9ee3d3,#b9d7ff)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.chk:last-child{border:0}.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);flex:none}.chk.on .dot{background:linear-gradient(135deg,#cbb9ff,#9ee3d3);border-color:transparent}.chk.on span{color:var(--mute);text-decoration:line-through}
select,input{width:100%;font:16px Tahoma,Arial,sans-serif;padding:13px 14px;border-radius:14px;border:1px solid rgba(72,66,98,.12);background:rgba(255,255,255,.58);color:var(--ink);outline:none}select:focus,input:focus{border-color:#a99be0;box-shadow:0 0 0 3px rgba(169,155,224,.16)}
.timer{font:700 50px Tahoma,Arial,sans-serif;letter-spacing:-1px}.pill{display:inline-block;padding:7px 13px;border-radius:99px;background:rgba(72,66,98,.09);color:var(--ink);margin:4px 4px 0 0;font-size:13px;font-weight:600;cursor:pointer}.pill.on{outline:2px solid #756b9b;outline-offset:1px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.12)}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:480px;margin:auto;background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(20px) saturate(120%);backdrop-filter:blur(20px) saturate(120%);border:1px solid rgba(255,255,255,.72);border-radius:32px;display:flex;padding:6px;gap:2px;box-shadow:0 12px 34px rgba(58,51,88,.12);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--ink);font:600 11px Tahoma,Arial,sans-serif;padding:9px 0;border-radius:26px;cursor:pointer}nav button.on{background:linear-gradient(135deg,#cbb9ff,#9ee3d3);color:#2b2a3a}nav b{display:block;font-size:18px}.brand{display:none}.deep nav{display:none}
.session-list{display:grid;gap:8px;margin-top:10px}.session-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.38)}
@media (prefers-reduced-motion:reduce){body:before{animation:none}}
@media(min-width:900px){#shell{display:grid;grid-template-columns:240px 1fr;max-width:1240px;margin:auto}nav{position:sticky;top:20px;align-self:start;left:auto;right:auto;bottom:auto;max-width:none;margin:20px 0 0 20px;height:calc(100vh - 40px);flex-direction:column;justify-content:flex-start;gap:6px;padding:20px 12px;border-radius:28px}nav button{display:flex;align-items:center;gap:12px;text-align:left;font-size:15px;padding:13px 16px}nav b{display:inline;font-size:18px}.brand{display:block;font:700 25px/1.1 Tahoma,Arial,sans-serif;padding:4px 10px 24px}main{max-width:none;width:100%;padding:44px 40px 60px}.g2{grid-template-columns:1fr 1fr;align-items:start}.deep #shell{display:block}.deep main{max-width:760px;margin:auto}}
</style></head><body><div id="shell"><nav id="nav"></nav><main id="app"></main></div>
<script>
const SUBJ={
"Phase 1":{"Reasoning":["Puzzles & seating","Syllogism","Inequalities","Blood relations & direction","Coding-decoding","Data sufficiency","Input-output"],
"General Awareness":["RBI & banking basics","Monetary policy","Budget & Economic Survey","Static GK","Awards, summits, sports"],
"Current Affairs":["Banking & RBI news","Economy data & reports","Government schemes","International organisations","Monthly revision"],
"Quant":["Data interpretation","Number series","Simplification","Percentage & ratio","Profit, loss, SI/CI","Time, work, speed","Probability & P&C"],
"English":["Reading comprehension","Cloze test","Error spotting","Para jumbles","Vocabulary"]},
"Phase 2":{"Finance":["Financial system & markets","Financial institutions & regulators","Risk management & Basel","Fiscal policy & public finance","Corporate finance & ratios","Derivatives & forex","Financial inclusion & fintech"],
"Management":["Motivation theories","Leadership","Organisational structure","HRM","Strategy","Communication","Ethics & CSR"],
"ESI":["Growth & development","Inflation & monetary policy","Indian economy sectors","Poverty & employment","Globalisation & BoP","Demography & social structure","Education & health"],
"English (Desc.)":["Essay writing","Précis","Comprehension","Letter & report writing"]},
"Interview":{"Interview":["DAF & profile","Economy opinions","RBI knowledge","Current issues","Mock interviews"]}};
const NUDGE=["One focused session beats a long plan. Start with 25 minutes.","Every session is a vote for the officer you are becoming.","Revise yesterday's topic for 5 minutes before starting anything new.","Two hard subjects, one easy one. Balance your day.","Phone away, timer on. That is the whole trick.","Read one editorial today. Current affairs compounds.","Mock test today? Analyse it for twice as long as you took it.","Small and daily beats big and rare. Cast today's vote.","Write down one thing you learned. Teaching yourself locks it in.","Missed yesterday? Don't restart the story, just cast today's vote."];
const ALL=Object.values(SUBJ).flatMap(p=>Object.keys(p));
// pastel colour per subject, spread around the hue wheel
const col=s=>`hsl(${(ALL.indexOf(s)*47+220)%360} 60% 76%)`;
const K="rbi_atoms_v1";
let S={ident:"",exam:"",goal:"",done:{},logs:[],voted:{},mocks:[],custom:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||"{}"));
if(S.ident==='an RBI Grade B officer who understands the economy and shows up every day')S.ident="";
if(S.goal===120)S.goal="";
}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const ds=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>ds();
let tab="home",T={subj:ALL[0],mins:25,left:25*60,run:false,end:0,iv:null,start:0};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function streak(){let n=0,d=new Date();if(!S.voted[ds(d)])d.setDate(d.getDate()-1);while(S.voted[ds(d)]){n++;d.setDate(d.getDate()-1)}return n}
function best(){const k=Object.keys(S.voted).sort();let b=0,c=0,p=null;for(const x of k){c=p&&(new Date(x)-new Date(p))==864e5?c+1:1;b=Math.max(b,c);p=x}return b}
function vote(){S.voted[today()]=1;save()}
const logSec=l=>Number.isFinite(+l.sec)?+l.sec:Math.max(0,(+l.min||0)*60);
const secs=f=>S.logs.filter(f).reduce((a,l)=>a+logSec(l),0);
const mins=f=>Math.floor(secs(f)/60);
const fmtSec=s=>{s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;return h?`${h}h ${m}m`:m?`${m}m${r?` ${r}s`:""}`:`${r}s`};
const fmt=m=>fmtSec(m*60);
function tops(sub){return (Object.values(SUBJ).find(p=>p[sub])||{})[sub].concat(S.custom[sub]||[])}
function pct(sub){const t=tops(sub);return t.length?Math.round(t.filter(x=>S.done[sub+"|"+x]).length/t.length*100):0}
function suggest(){const wk=new Date();wk.setDate(wk.getDate()-6);const w=ds(wk);return ALL.map(s=>[s,mins(l=>l.sub==s&&l.d>=w)]).sort((a,b)=>a[1]-b[1])[0][0]}
// circular progress, p runs 0 to 1
const ring=(p,id,size,inner)=>{const r=52,c=2*Math.PI*r;return `<div style="position:relative;width:${size}px;height:${size}px;flex:none;margin:auto"><svg viewBox="0 0 120 120" width="${size}" height="${size}" style="transform:rotate(-90deg)"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#a893f0"/><stop offset="1" stop-color="#7fd0bd"/></linearGradient></defs><circle cx="60" cy="60" r="${r}" fill="none" stroke="#ffffff55" stroke-width="9"/><circle id="${id}c" cx="60" cy="60" r="${r}" fill="none" stroke="url(#${id})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(1,p))}"/></svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">${inner}</div></div>`};
const overall=()=>{const a=ALL.flatMap(s=>tops(s).map(t=>S.done[s+"|"+t]?1:0));return Math.round(a.reduce((x,y)=>x+y,0)/a.length*100)};
function days(){if(!S.exam)return null;return Math.ceil((new Date(S.exam)-new Date(today()))/864e5)}

function home(){const v=!!S.voted[today()],n=streak(),dd=days(),tm=secs(l=>l.d==today()),goal=Number(S.goal)||0;
const nudge=NUDGE[Math.floor(new Date()/864e5)%NUDGE.length],sg=suggest(),hr=new Date().getHours();
const hi=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
let wk="";for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);wk+=`<i class="${S.voted[ds(d)]?"on":""}">${"SMTWTFS"[d.getDay()]}</i>`}
const goalText=goal?`of ${fmtSec(goal*60)}`:"Set a daily goal";
const progress=goal?tm/(goal*60):0;
const todaySubjects=ALL.map(s=>[s,secs(l=>l.d==today()&&l.sub==s)]).filter(x=>x[1]>0);
return `<div class="row"><div><h1>Daily Progress</h1><div class="mute">${hi} · ${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}</div></div><span class="chip">⚡ ${n}</span></div>
<div class="hero">${ring(progress,"hr",150,`<div><div class="serif" style="font-size:30px">${fmtSec(tm)}</div><div style="opacity:.7;font-size:13px">${goalText}</div></div>`)}
<div style="flex:1;min-width:220px"><div style="opacity:.7;font-size:14px">I am becoming</div><div class="serif" style="font-size:22px;line-height:1.25;margin:4px 0 14px">${S.ident||"Write your own definition…"}</div><div class="wk">${wk}</div><div style="margin-top:16px"><button class="btn" onclick="castVote()">${v?"Voted today ✓":"Cast today's vote"}</button></div></div></div>
<div class="g2"><div class="card"><div class="mute">Today's nudge</div><div class="serif" style="font-size:21px;margin:6px 0 12px">${nudge}</div><div class="mute">Least studied this week</div><span class="pill" style="background:${col(sg)};color:#2b2a3a">${sg}</span><div style="margin-top:14px"><button class="btn" onclick="T.subj='${sg}';go('focus')">Start focus</button></div></div>
<div class="card row" style="text-align:center;align-items:flex-start"><div><div class="big">${dd==null?"—":dd}</div><div class="mute">days to exam</div></div><div><div class="big">${Object.keys(S.voted).length}</div><div class="mute">votes</div></div><div><div class="big">${overall()}%</div><div class="mute">syllabus</div></div></div></div>
${todaySubjects.length?`<div class="card"><div class="mute">Today by subject</div><div class="session-list">${todaySubjects.map(([sub,sec])=>`<div class="session-row"><span>${sub}</span><b>${fmtSec(sec)}</b></div>`).join("")}</div></div>`:""}
<div class="card"><div class="g2"><div><div class="mute" style="margin-bottom:6px">Exam date</div><input type="date" value="${S.exam}" onchange="S.exam=this.value;save();render()"></div><div><div class="mute" style="margin-bottom:6px">Daily goal (minutes)</div><input type="number" min="1" step="1" placeholder="Set a goal" value="${goal||""}" onchange="S.goal=this.value.trim()===""?"":Math.max(1,+this.value||1);save();render()"></div></div>
<div class="mute" style="margin:14px 0 6px">I am becoming…</div><input placeholder="Write your own definition…" value="${S.ident.replace(/"/g,"&quot;")}" onchange="S.ident=this.value;save();render()"></div>`}
function castVote(){if(S.voted[today()])return toast("Already voted today");vote();toast("Vote cast ⚡");render()}

function study(){let h=`<h1>Syllabus</h1><p class="mute">Tap a topic when you finish it.</p>`;
for(const [ph,subs] of Object.entries(SUBJ)){h+=`<h2>${ph}</h2><div class="g2">`;for(const s of Object.keys(subs)){const p=pct(s);
h+=`<details class="card"><summary class="row" style="list-style:none;cursor:pointer"><span class="serif" style="font-size:19px">${s}</span><span class="mute">${p}%</span></summary><div class="bar" style="margin:10px 0"><i style="width:${p}%;background:${col(s)}"></i></div>`+
tops(s).map((t,i)=>`<div class="chk ${S.done[s+"|"+t]?"on":""}" onclick="tg('${s}','${t.replace(/'/g,"\\'")}')"><div class="dot"></div><span>${t}</span></div>`).join("")+
`<div style="margin-top:10px"><input placeholder="Add a topic and press Enter" onkeydown="if(event.key=='Enter'&&this.value.trim()){(S.custom['${s}']=S.custom['${s}']||[]).push(this.value.trim());save();render()}"></div></details>`}h+="</div>"}
return h}
function tg(s,t){const k=s+"|"+t;S.done[k]?delete S.done[k]:S.done[k]=1;save();const o=[...document.querySelectorAll("details")].map(d=>d.open);render();document.querySelectorAll("details").forEach((d,i)=>d.open=o[i])}

function focus(){const t=T.mins*60,m=Math.floor(T.left/60),sc=T.left%60;
const elapsed=Math.max(0,t-T.left);
return `<h1>Focus</h1><p class="mute">${T.run?"Timer running. Finish whenever you want — even after a few seconds.":"Pick a subject and a length, then begin."}</p>
<div class="g2"><div class="card" style="text-align:center;padding:26px">${ring(1-T.left/t,"fr",250,`<div><div id="tm" class="timer">${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}</div><div class="mute">${T.subj}</div><div id="el" class="mute" style="margin-top:4px">${elapsed?`Logged if finished: ${fmtSec(elapsed)}`:"Start when ready"}</div></div>`)}
<div style="margin-top:22px"><button class="btn" onclick="tgl()">${T.run?"Pause":(T.left<t?"Resume":"Start")}</button> ${T.left<t||T.run?`<button class="btn ghost" onclick="stopT()">Finish</button>`:""}</div></div>
<div class="card"><div class="mute">Subject</div>${ALL.map(x=>`<span class="pill ${x==T.subj?"on":""}" style="background:${col(x)};color:#2b2a3a" onclick="if(!T.run){T.subj='${x}';render()}">${x}</span>`).join("")}
<div class="mute" style="margin-top:18px">Length</div>${[15,25,45,60].map(x=>`<span class="pill ${T.mins==x?"on":""}" onclick="setLen(${x})">${x} min</span>`).join("")}
<p class="mute" style="margin-bottom:0">Every finished session records the exact seconds and adds them to that subject.</p></div></div>`}
function setLen(x){if(T.run)return;T.mins=x;T.left=x*60;render()}
function tick(){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));const rc=$("#frc");if(rc)rc.setAttribute("stroke-dashoffset",326.7*T.left/(T.mins*60));const e=$("#tm");if(e)e.textContent=String(Math.floor(T.left/60)).padStart(2,"0")+":"+String(T.left%60).padStart(2,"0");const el=$("#el");if(el){const done=Math.max(0,T.mins*60-T.left);el.textContent=done?`Logged if finished: ${fmtSec(done)}`:"Start when ready"}if(T.left<=0){beep();stopT(true)}}
function tgl(){if(T.run){clearInterval(T.iv);T.run=false;document.body.classList.remove("deep")}else{document.body.classList.add("deep");T.end=Date.now()+T.left*1000;T.run=true;T.iv=setInterval(tick,250);try{navigator.wakeLock&&navigator.wakeLock.request("screen")}catch(e){}}render()}
function stopT(full){clearInterval(T.iv);T.run=false;document.body.classList.remove("deep");const doneSec=Math.max(0,(T.mins*60-T.left));
if(full===true||doneSec>0){S.logs.push({d:today(),sub:T.subj,sec:doneSec});vote();toast(`Logged ${fmtSec(doneSec)} · ${T.subj} · vote cast ⚡`)}
T.left=T.mins*60;save();render()}
function beep(){try{navigator.vibrate&&navigator.vibrate([300,150,300]);const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=660;o.start();o.stop(c.currentTime+.4)}catch(e){}}

function prog(){const tot=secs(()=>true),votes=Object.keys(S.voted).length;
const per=ALL.map(s=>[s,secs(l=>l.sub==s)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),mx=per[0]?per[0][1]:1;
const all=ALL.flatMap(s=>tops(s).map(t=>S.done[s+"|"+t]?1:0)),over=Math.round(all.reduce((a,b)=>a+b,0)/all.length*100);
const w7=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return["SMTWTFS"[d.getDay()],secs(l=>l.d==ds(d))]}),m7=Math.max(60,...w7.map(x=>x[1]));
const wkc=`<div class="card"><div class="mute">Last 7 days</div><div style="display:flex;gap:10px;align-items:flex-end;height:120px;margin-top:10px">${w7.map(([a,m])=>`<div style="flex:1;text-align:center"><div style="height:${Math.max(4,m/m7*90)}px;background:linear-gradient(var(--a),var(--b));border-radius:10px"></div><div class="mute" style="font-size:12px;margin-top:4px">${a}</div></div>`).join("")}</div></div>`;
const ms=S.mocks.slice(-12),pts=ms.map((m,i)=>[ms.length>1?20+i*(260/(ms.length-1)):150,100-(m.score/m.max*80)]);
return `<h1>Progress</h1><div class="g2">
<div class="card"><div class="mute">Total votes</div><div class="serif" style="font-size:44px">${votes}</div><div class="mute">Study time ${fmtSec(tot)} · streak ${streak()} · best ${best()}${L.length?` · ${L.filter(d=>d.status=="Done").length}/${L.length} files read`:""}</div></div>
<div class="card"><div class="row"><span class="mute">Syllabus complete</span><b>${over}%</b></div><div class="bar" style="margin-top:8px"><i style="width:${over}%"></i></div></div>
${wkc}<div class="card"><div class="mute" style="margin-bottom:8px">Time per subject</div>${per.length?per.map(([s,sec])=>`<div style="margin:9px 0"><div class="row"><span>${s}</span><span class="mute">${fmtSec(sec)}</span></div><div class="bar"><i style="width:${sec/mx*100}%;background:${col(s)}"></i></div></div>`).join(""):`<span class="mute">Finish a focus session to see this.</span>`}</div>
<div class="card"><div class="mute" style="margin-bottom:8px">Session log</div>${per.length?per.map(([s,sec])=>`<div class="session-row" style="margin-top:6px"><span>${s}</span><b>${fmtSec(sec)}</b></div>`).join(""):`<span class="mute">No focus sessions yet.</span>`}</div>
<div class="card"><div class="mute" style="margin-bottom:8px">Mock tests</div>
${ms.length?`<svg viewBox="0 0 300 110" style="width:100%"><defs><linearGradient id="g"><stop offset="0" stop-color="#f0b35a"/><stop offset="1" stop-color="#c56be8"/></linearGradient></defs><polyline fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#c56be8"/>`).join("")}</svg><div class="mute">Latest: ${ms[ms.length-1].sub} ${ms[ms.length-1].score}/${ms[ms.length-1].max}</div>`:`<span class="mute">No mocks logged yet.</span>`}
<div style="margin-top:12px"><select id="ms">${ALL.concat(["Full mock"]).map(s=>`<option>${s}</option>`).join("")}</select></div>
<div class="row" style="margin-top:8px"><input id="sc" type="number" placeholder="Score"><input id="mx" type="number" placeholder="Out of" value="100"></div>
<div style="margin-top:10px"><button class="btn" onclick="addMock()">Save mock score</button></div></div>
<div class="card"><div class="mute" style="margin-bottom:8px">Backup</div><button class="btn ghost" onclick="exp()">Copy data</button> <button class="btn ghost" onclick="imp()">Restore data</button></div></div>`}
function addMock(){const s=+$("#sc").value,m=+$("#mx").value;if(!m||isNaN(s))return toast("Enter score and total");S.mocks.push({d:today(),sub:$("#ms").value,score:s,max:m});save();toast("Mock saved");render()}
function exp(){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>toast("Copied. Paste it somewhere safe"),()=>prompt("Copy your data:",j))}
function imp(){const j=prompt("Paste backup data:");if(!j)return;try{S=Object.assign(S,JSON.parse(j));save();toast("Restored");render()}catch(e){toast("That backup is not valid")}}


// library: the files sit in indexedDB, everything else in localStorage
let L=[],Lready=false,LF="All";
const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open("rbi_lib",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
const dbAll=async()=>{const d=await DB();return new Promise(r=>{const q=d.transaction("f").objectStore("f").getAll();q.onsuccess=()=>r(q.result)})};
const dbPut=async o=>{const d=await DB();return new Promise(r=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(o);t.oncomplete=r})};
const dbDel=async id=>{const d=await DB();return new Promise(r=>{const t=d.transaction("f","readwrite");t.objectStore("f").delete(id);t.oncomplete=r})};
const esc=x=>x.replace(/[<>&"]/g,c=>"&#"+c.charCodeAt(0)+";");
const kind=d=>/pdf/i.test(d.type+d.name)?"pdf":/^image/.test(d.type)?"img":"txt";
function lib(){
if(!Lready){dbAll().then(x=>{L=x;Lready=true;render()}).catch(()=>{Lready=true;render()});return `<h1>Library</h1><p class="mute">Loading…</p>`}
const list=L.filter(d=>LF=="All"||d.sub==LF).sort((a,b)=>b.id-a.id);
return `<h1>Library</h1><p class="mute">Add PDFs, photos of notes, or text files. They stay on this phone.</p>
<div class="card"><div class="mute" style="margin-bottom:6px">Add to subject</div><select id="lsub">${ALL.concat(["General"]).map(s=>`<option ${s==LS?"selected":""}>${s}</option>`).join("")}</select>
<label class="btn" style="display:block;text-align:center;margin-top:12px">Add files<input type="file" multiple accept=".pdf,.txt,.md,image/*" hidden onchange="addFiles(this.files)"></label></div>
<select onchange="LF=this.value;render()">${["All"].concat(ALL,["General"]).map(s=>`<option ${s==LF?"selected":""}>${s}</option>`).join("")}</select>
${list.length?list.map(d=>{const p=d.status=="Done"?100:d.total?Math.min(100,Math.round(d.pages/d.total*100)):0;return `<div class="card"><div class="row"><b style="word-break:break-word">${esc(d.name)}</b><span class="pill" style="background:${col(d.sub)};color:#2b2a3a">${d.sub}</span></div><div class="mute">${d.status}${d.total?` · ${d.pages}/${d.total} pages`:""}</div><div class="bar" style="margin:8px 0"><i style="width:${p}%;background:${col(d.sub)}"></i></div><div class="row"><button class="btn" onclick="openDoc(${d.id})">Read</button><button class="btn ghost" onclick="delDoc(${d.id})">Delete</button></div></div>`}).join(""):`<div class="card mute">Nothing here yet. Add your first handout or short notes above.</div>`}`}
let LS=ALL[0];
async function addFiles(fs){LS=$("#lsub").value;let n=0;for(const f of fs){if(!/pdf|image|text|markdown/i.test(f.type)&&!/\.(pdf|txt|md)$/i.test(f.name)){toast("Skipped "+f.name+" (use PDF, image or text)");continue}
const d={id:Date.now()+n++,name:f.name,type:f.type,sub:LS,status:"To read",pages:0,total:0,added:today(),blob:f};try{await dbPut(d);L.push(d)}catch(e){toast("Could not save "+f.name)}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(n)toast("Added "+n+" file"+(n>1?"s":""));render()}
async function delDoc(id){if(!confirm("Delete this file from the app?"))return;await dbDel(id);L=L.filter(d=>d.id!=id);render()}
async function openDoc(id){const d=L.find(x=>x.id==id),k=kind(d);const o=document.createElement("div");o.id="rd";
o.style.cssText="position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)";
o.innerHTML=`<div class="row" style="padding:12px 16px"><b style="word-break:break-word">${esc(d.name)}</b><button class="btn ghost" onclick="closeDoc()">Close</button></div><div id="rb" style="flex:1;overflow:auto;padding:0 16px"></div>
<div style="padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="mute">Page</span><input id="pg" type="number" value="${d.pages}" style="width:78px"><span class="mute">of</span><input id="tp" type="number" value="${d.total||""}" style="width:78px"><button class="btn" onclick="saveDoc(${id},false)">Save</button><button class="btn ghost" onclick="saveDoc(${id},true)">Mark done</button></div>`;
document.body.appendChild(o);const b=$("#rb");
if(k=="pdf"){b.style.padding="0";b.innerHTML=`<iframe src="${URL.createObjectURL(d.blob)}" style="width:100%;height:100%;border:0"></iframe>`}
else if(k=="img"){const r=new FileReader();r.onload=()=>b.innerHTML=`<img src="${r.result}" style="width:100%">`;r.readAsDataURL(d.blob)}
else{b.innerHTML=`<pre style="white-space:pre-wrap;font:16px/1.6 Tahoma,Arial,sans-serif"></pre>`;b.firstChild.textContent=await d.blob.text()}}
function closeDoc(){const o=$("#rd");if(o)o.remove()}
async function saveDoc(id,done){const d=L.find(x=>x.id==id),old=d.pages;d.pages=+$("#pg").value||0;d.total=+$("#tp").value||0;
d.status=(done||(d.total&&d.pages>=d.total))?"Done":(d.pages>0?"Reading":d.status);await dbPut(d);
if(done||d.pages>old){vote();toast("Progress saved · vote cast ⚡")}else toast("Progress saved");closeDoc();render()}
const TABS=[["home","●","Home"],["study","☰","Syllabus"],["lib","▤","Library"],["focus","◔","Focus"],["prog","▮","Progress"]];
function go(t){tab=t;render()}
function render(){const v={home,study,focus,prog,lib}[tab]();$("#app").innerHTML=v;$("#nav").innerHTML='<div class="brand">Daily<br>Progress</div>'+TABS.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");window.scrollTo(0,0)}
render();
// keep tracking parameters out of the app URL
try{
  const u=new URL(location.href);
  const keys=[...u.searchParams.keys()].filter(k=>k.toLowerCase().startsWith("utm_"));
  if(keys.length){keys.forEach(k=>u.searchParams.delete(k));history.replaceState({},document.title,u.pathname+(u.searchParams.toString()?"?"+u.searchParams.toString():"")+u.hash);}
}catch(e){}
// offline support
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
